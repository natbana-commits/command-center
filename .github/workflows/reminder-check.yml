name: Reminder check + keep-warm ping

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -sf -X POST "https://command-center-navy-pi.vercel.app/api/reminder-check" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_CHECK_SECRET }}"

      # Keeps each of the (now-consolidated, post cold-start cleanup) page
      # functions' serverless containers warm — an unauthenticated GET still
      # invokes the function even though requireAuth immediately redirects
      # it to login, which is all a warming ping needs. One path per
      # function: /donna/files and /donna/school share donna-calendar.ts's
      # container with /donna/calendar, /donna/contacts shares
      # donna-reminders.ts's with /donna/reminders, /donna/ipos shares
      # donna-finances.ts's with /donna/finances — no need to ping those
      # separately. /donna/news is its own function (api/donna-news.ts) and
      # shares nothing, so it needs its own ping too — it's a real nav tab,
      # not a background job, and was cold-starting on essentially every
      # visit before this. Best-effort: a single path being briefly
      # unreachable shouldn't fail this job or the reminder-check step above.
      - name: Keep main pages warm
        run: |
          for path in /donna /donna/chat /donna/settings /donna/reminders /donna/calendar /donna/finances /donna/news; do
            curl -s -o /dev/null -m 15 "https://command-center-navy-pi.vercel.app$path" || true
          done
